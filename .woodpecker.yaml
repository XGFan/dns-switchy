when:
  branch: master
  event: [push, manual]

steps:
  - name: test
    image: golang:1.26-alpine
    commands:
      - go vet ./...
      - go test -timeout 3m ./...

  - name: build-ipk
    image: golang:1.26-alpine
    commands:
      - apk add --no-cache tar fakeroot gzip bash git python3
      - SHORT_SHA=$(echo $CI_COMMIT_SHA | cut -c1-8)
      - bash scripts/build-openwrt-ipk.sh --version "v0.0.0-$SHORT_SHA" --arch x86_64
      - ls -lh dist/ipk/*/artifacts/*.ipk

  - name: deploy
    image: alpine
    commands:
      - apk add --no-cache openssh-client
      - mkdir -p ~/.ssh
      - echo "$CI_SSH_KEY" > ~/.ssh/deploy_key
      - chmod 600 ~/.ssh/deploy_key
      - ssh-keyscan -H "$OPENWRT_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
      # 只传服务 ipk，不传 luci-app（net-console ADR-0005：LuCI 入口退役；luci-app 仍构建防烂）。
      # 用独立目录 + 每次先清空：失败的 run 不会把 ipk 留给下一次。
      - ssh $SSH_OPTS "$OPENWRT_USER@$OPENWRT_HOST" 'rm -rf /tmp/dns-deploy && mkdir -p /tmp/dns-deploy'
      - scp $SSH_OPTS dist/ipk/*/artifacts/dns-switchy_*.ipk deploy/openwrt/ci-deploy.sh "$OPENWRT_USER@$OPENWRT_HOST:/tmp/dns-deploy/"
      # ci-deploy.sh 自己做安装、带 key 探 API、nslookup 验解析、失败装回 lastgood —— dns 挂了
      # 是全网断解析，这些判断必须写清楚，不塞在一行 ssh 里。
      - ssh $SSH_OPTS "$OPENWRT_USER@$OPENWRT_HOST" 'cd /tmp/dns-deploy && sh ci-deploy.sh'
      - ssh $SSH_OPTS "$OPENWRT_USER@$OPENWRT_HOST" 'rm -rf /tmp/dns-deploy'
      - rm -f ~/.ssh/deploy_key
    environment:
      CI_SSH_KEY:
        from_secret: ci_ssh_key
      OPENWRT_HOST:
        from_secret: openwrt_host
      OPENWRT_USER:
        from_secret: openwrt_user

  - name: notify-success
    image: docker.test4x.com/xgfan/plugin-bark
    failure: ignore
    settings:
      token:
        from_secret: bark_token
      status: success

  - name: notify-failure
    image: docker.test4x.com/xgfan/plugin-bark
    failure: ignore
    settings:
      token:
        from_secret: bark_token
      status: failure
    when:
      - status: [failure]
