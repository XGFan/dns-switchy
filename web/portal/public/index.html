<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DNS Switchy</title>
    <style>
      /* standalone 宿主页只负责给面板一个居中容器；面板自己的样式在 Shadow DOM 里。 */
      body {
        margin: 0;
        padding: 1.5rem 1rem;
        font-family: system-ui, -apple-system, 'PingFang SC', sans-serif;
        background: #fff;
        color: #1f2328;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #13171f;
          color: #e5e9f0;
        }
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
      }
      h1 {
        font-size: 1.15rem;
        margin: 0 0 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>DNS Switchy</h1>
      <dns-panel api-base="/api"></dns-panel>
    </main>
    <script type="module" src="/panel.js"></script>
  </body>
</html>
